<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Observasi Pembelajaran — UPTD SPF SD Negeri Lanas 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --paper:#FFFFFF; --paper2:#F6F8FA;
  --ink:#15181C; --muted:#5B6673; --line:#D9E0E7;
  --merah:#9E2A2B; --merah-bg:#FAEDED;
  --hijau:#1E6B4E; --hijau-bg:#E9F4EF;
  --biru:#1B4D7E; --biru-bg:#E9F0F7;
  --amber:#8A5A0B; --amber-bg:#FBF1DF;
  --shadow:0 1px 0 rgba(21,24,28,.06), 0 6px 18px -12px rgba(21,24,28,.35);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --paper:#181C21; --paper2:#1E232A;
    --ink:#EDF1F5; --muted:#9AA6B3; --line:#2B323A;
    --merah:#E2807F; --merah-bg:#2B1C1D;
    --hijau:#79C9A6; --hijau-bg:#152520;
    --biru:#8FBBE6; --biru-bg:#14202C;
    --amber:#DDB05F; --amber-bg:#261F12;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --paper:#181C21; --paper2:#1E232A;
  --ink:#EDF1F5; --muted:#9AA6B3; --line:#2B323A;
  --merah:#E2807F; --merah-bg:#2B1C1D;
  --hijau:#79C9A6; --hijau-bg:#152520;
  --biru:#8FBBE6; --biru-bg:#14202C;
  --amber:#DDB05F; --amber-bg:#261F12;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
#app{max-width:680px;margin:0 auto;padding:0 14px 108px}
h1,h2,h3{margin:0;line-height:1.25;font-weight:800;letter-spacing:-.015em}
p{margin:0 0 10px}
a{color:var(--biru)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--biru);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:38px;flex:none;border-radius:10px;background:var(--merah);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
:root[data-theme="dark"] .crest,
:root:not([data-theme="light"]) .crest{color:#1a0d0d}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .crest{color:#fff}}
.top h1{font-size:15px}
.top .sub{font-size:12px;color:var(--muted);font-weight:500}
.iconbtn{margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:14px}

/* ---------- blocks ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card.tight{padding:12px}
.sec-title{font-size:12px;font-weight:800;color:var(--muted);margin:22px 2px 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xsmall{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- hero ring ---------- */
.hero{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.hero-num{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- menu grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:16px 14px;text-align:left;cursor:pointer;min-height:86px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.tile .em{font-size:20px;line-height:1}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--muted)}
.tile:active{background:var(--paper2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);background:var(--paper);border-radius:12px;
  padding:13px 16px;font-weight:600;cursor:pointer;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--merah);border-color:var(--merah);color:#fff}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#1a0d0d}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--merah);border-color:var(--merah)}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* ---------- forms ---------- */
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper2);
  border:1px solid var(--line);border-radius:11px;padding:12px;min-height:48px}
textarea{min-height:86px;resize:vertical;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}

/* ---------- indicator card ---------- */
.ind{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.ind .no{font-size:12px;font-weight:800;color:var(--merah)}
.ind .q{font-weight:600;margin:2px 0 10px}
.scale{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);
  background:var(--paper2);border-radius:11px;padding:11px 8px;font-size:14px;font-weight:600;min-height:46px;cursor:pointer;text-align:center}
.opt input:checked + span{border-color:var(--merah);background:var(--merah-bg);color:var(--merah)}
.opt input:focus-visible + span{outline:3px solid var(--biru);outline-offset:2px}
.scale.two{grid-template-columns:repeat(2,1fr)}
.note{margin-top:10px}
.note input{min-height:44px;font-size:14px}

/* ---------- steps ---------- */
.steps{margin:12px 0 4px}
.steps .bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.steps .bar i{display:block;height:100%;background:var(--merah);border-radius:99px}
.steps .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}

/* ---------- tables / lists ---------- */
.list-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;box-shadow:var(--shadow)}
.list-item .t{font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);color:var(--muted)}
.tag.ok{background:var(--hijau-bg);color:var(--hijau);border-color:transparent}
.tag.warn{background:var(--amber-bg);color:var(--amber);border-color:transparent}
.tag.bad{background:var(--merah-bg);color:var(--merah);border-color:transparent}
.tag.info{background:var(--biru-bg);color:var(--biru);border-color:transparent}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.bars{margin-top:6px}
.barrow{margin:9px 0}
.barrow .bl{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.barrow .bt{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.barrow .bt i{display:block;height:100%;background:var(--biru);border-radius:99px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex}
.nav div{max-width:680px;margin:0 auto;display:flex;width:100%}
.nav button{flex:1;background:none;border:0;padding:7px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:700;color:var(--muted);border-radius:10px}
.nav button .em{font-size:19px;line-height:1}
.nav button[aria-current="page"]{color:var(--merah)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:60;background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:90%}

/* ---------- report / print ---------- */
#print-area{display:none}
.report{background:#fff;color:#000;padding:18px;border-radius:var(--r);border:1px solid var(--line);font-size:13.5px}
.report h2{font-size:15px;text-align:center}
.report .kop{text-align:center;border-bottom:2.5px solid #000;padding-bottom:8px;margin-bottom:12px}
.report table{font-size:12.5px}
.report th,.report td{border:1px solid #999;padding:5px 7px}
.report .ttd{margin-top:26px;display:flex;justify-content:space-between;text-align:center;font-size:12.5px}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  #app,.nav,.toast{display:none!important}
  #print-area{display:block!important}
  .report{border:0;padding:0;border-radius:0}
  .report .pagebreak{page-break-before:always}
}

/* =============== TEMA BARU: Hijau Ijen + Emas =============== */

:root[data-theme="dark"]{--bg:#0B1413;--paper:#13201E;--paper2:#182826;--ink:#E8F0ED;--muted:#93A8A1;--line:#244039;

h1,h2,h3,.hero-num,.stat b{font-family:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif}
.top,.login,.hero-card{background-color:var(--deep);

  background-size:24px 24px;background-position:0 0,12px 12px}
.top{border-bottom:3px solid var(--gold);color:#fff;padding-top:max(12px,env(safe-area-inset-top))}
.top h1{font-size:15px;color:#fff}.top .sub{color:rgba(255,255,255,.72)}
.top .crest{background:var(--gold)!important;color:#241803!important;border-radius:12px}
.top .iconbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:600}
.iconbtn+.iconbtn{margin-left:0}.top-row{gap:10px}.ttl{min-width:0;flex:1}
.hero-card{border:0;color:#fff;border-radius:20px;padding:20px}
.hero-card .hero-num{color:#fff;font-size:32px}.hero-card .muted{color:rgba(255,255,255,.74)}
.hero-card svg text{fill:#fff}.hero-card circle:first-of-type{stroke:rgba(255,255,255,.16)}
.hero-card hr{border-top-color:rgba(255,255,255,.16)}
.hero-card .stat{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.hero-card .stat span{color:rgba(255,255,255,.72)}
.hero-card .btn.primary{background:var(--gold);border-color:var(--gold);color:#241803}
.tile{border-radius:18px;gap:4px;min-height:112px;justify-content:space-between}
.tile .em{width:40px;height:40px;border-radius:12px;background:var(--merah-bg);color:var(--merah);display:grid;place-items:center}
.tile:hover{border-color:var(--merah)}
svg.ic{width:21px;height:21px}
.nav{left:50%;right:auto;transform:translateX(-50%);width:min(660px,calc(100% - 20px));bottom:max(10px,env(safe-area-inset-bottom));
  border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 14px 30px -14px rgba(10,47,44,.5)}
.nav button{padding:8px 2px}.nav button .em{display:grid}
.nav button[aria-current="page"]{background:var(--merah-bg);color:var(--merah)}
.toast{bottom:96px}
a.btn{text-decoration:none;color:var(--ink)}
.embed{width:100%;height:520px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--paper2)}
.login{position:fixed;inset:0;z-index:100;overflow:auto;display:grid;place-items:center;padding:24px 16px}
.lg-wrap{width:100%;max-width:400px}
.lg-tag{color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:26px;line-height:1.2;margin:0 4px 18px}
.lg-card{background:var(--paper);border-radius:24px;padding:26px 24px;border-top:5px solid var(--gold);box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.lg-card .crest.big{width:52px;height:52px;font-size:17px;background:var(--deep);color:var(--gold);margin-bottom:14px}
.lg-card h1{font-size:19px}.lg-err{color:#B3261E;font-size:13px;font-weight:600;margin:12px 0 0}
:root[data-theme="dark"] .lg-err{color:#F2A19B}
</style>

/* ============================ MIGRASI INSTRUMEN ============================ */
/* Data lama yang sudah tersimpan tidak otomatis memuat model baru. Fungsi ini menambahkan model baku
   yang belum ada (sebelum "Lainnya") tanpa mengubah isi yang sudah disunting pengguna. */
function migrasiInstrumen(I){
  if(!I || !Array.isArray(I.model)) return false;
  const sebelum = JSON.stringify(I);
  const inq = I.model.find(m=>m.id==="inquiry");
  if(inq && inq.nama==="Inquiry Learning") inq.nama = "Inquiry-Based Learning";
  ["discovery","ctl"].forEach(id=>{
    if(I.model.some(m=>m.id===id)) return;
    const baku = DEF_INSTRUMEN.model.find(m=>m.id===id);
    if(!baku) return;
    const salin = JSON.parse(JSON.stringify(baku));
    const at = I.model.findIndex(m=>m.id==="lainnya");
    if(at>=0) I.model.splice(at,0,salin); else I.model.push(salin);
  });
  if(I.versi==="1.0") I.versi="1.1";
  return JSON.stringify(I)!==sebelum;
}

let S = {settings:null, guru:null, instrumen:null, obs:[]};
let DB = null, dbReady = false;
const LSK = "obsapp.lanas1.v1";

function loadLocal(){
  try{
    const raw = localStorage.getItem(LSK);
    if(raw){const d = JSON.parse(raw);
      S.settings = Object.assign({}, DEF_SETTINGS, d.settings||{});
      S.guru = d.guru || DEF_GURU.slice();
      S.instrumen = d.instrumen || JSON.parse(JSON.stringify(DEF_INSTRUMEN));
      S.obs = d.obs || [];
      if(migrasiInstrumen(S.instrumen)) saveLocal();
      return;}
  }catch(e){}
  S.settings = JSON.parse(JSON.stringify(DEF_SETTINGS));
  S.guru = JSON.parse(JSON.stringify(DEF_GURU));
  S.instrumen = JSON.parse(JSON.stringify(DEF_INSTRUMEN));
  S.obs = [];
}
function saveLocal(){
  try{ localStorage.setItem(LSK, JSON.stringify(S)); }catch(e){}
}
async function persist(what){
  saveLocal();
  if(!DB) return;
  try{
    if(!what || what==="settings") await DB.doc("app/settings").set({v:S.settings});
    if(!what || what==="guru")     await DB.doc("app/guru").set({v:S.guru});
    if(!what || what==="instrumen")await DB.doc("app/instrumen").set({v:S.instrumen});
    if(!what || what==="obs")      await DB.doc("app/observasi").set({v:S.obs});
  }catch(e){ console.warn("db write",e); }
}
async function initDB(){
  let db=null;
  try{ db = window.claude && claude.use ? await claude.use("db") : null; }catch(e){ db=null; }
  if(!db){ dbReady=true; return; }
  DB = db;
  try{
    const [a,b,c,d] = await Promise.all([
      DB.doc("app/settings").get(), DB.doc("app/guru").get(),
      DB.doc("app/instrumen").get(), DB.doc("app/observasi").get()
    ]);
    if(a.exists||b.exists||c.exists||d.exists){
      if(a.exists) S.settings = Object.assign({}, DEF_SETTINGS, a.data().v||{});
      if(b.exists) S.guru = b.data().v||S.guru;
      if(c.exists) S.instrumen = c.data().v||S.instrumen;
      if(d.exists) S.obs = d.data().v||S.obs;
      if(migrasiInstrumen(S.instrumen)) await persist("instrumen");
      saveLocal();
    } else {
      await persist();
    }
  }catch(e){ console.warn("db read",e); }
  dbReady=true;
  render();
}

const aktifA = ()=>S.instrumen.bagianA.filter(x=>x.aktif);
const aktifUDL = ()=>S.instrumen.udl.filter(x=>x.aktif);
const getModel = id => S.instrumen.model.find(m=>m.id===id);
function indModel(id){const m=getModel(id);return m?m.indikator.filter(x=>x.aktif):[];}
/* langkah yang dinilai pada Bagian B: model baku dari instrumen, atau sintaks model "Lainnya" milik observasi ini */
function langkahModel(o){
  if(!o) return [];
  if(o.modelId==="lainnya") return (o.sintaksLainList||[]).filter(x=>x && x.teks && x.teks.trim());
  return indModel(o.modelId);
}

function hitung(o){
  const A = aktifA(), U = aktifUDL(), MI = langkahModel(o);
  const skorA = A.reduce((s,i)=>s+num(o.skorA&&o.skorA[i.id]),0);
  const maxA = A.length*4;
  let skorM=0, maxM=MI.length*4;
  MI.forEach(i=>{ skorM += num(o.skorModel&&o.skorModel[i.id]&&o.skorModel[i.id].skor); });
  const total = skorA+skorM, maxTot = maxA+maxM;
  const persen = maxTot? Math.round((total/maxTot)*1000)/10 : 0;
  const persenA = maxA? Math.round((skorA/maxA)*1000)/10 : 0;
  const persenM = maxM? Math.round((skorM/maxM)*1000)/10 : 0;
  const udlYa = U.filter(i=>o.udl && o.udl[i.id] && o.udl[i.id].ya==="ya").length;
  const persenUDL = U.length? Math.round((udlYa/U.length)*1000)/10 : 0;
  return {skorA,maxA,persenA,skorM,maxM,persenM,total,maxTot,persen,udlYa,udlN:U.length,persenUDL,kategori:kategoriDari(persen)};
}
function kategoriDari(p){
  const k = S.instrumen.kategori.slice().sort((a,b)=>b.min-a.min);
  for(const x of k){ if(p>=num(x.min)) return x; }
  return k[k.length-1]||{label:"-",warna:""};
}

const CONTOH_UMUM = "Tulis kegiatan guru dan respons murid yang terlihat, misalnya jumlah murid yang terlibat atau hasil kerja yang tampak.";
const skorTertinggi = ()=>Math.max(4,...S.instrumen.skala.map(x=>num(x.n)));
function huruf(t){t=String(t||"");return t.charAt(0).toUpperCase()+t.slice(1);}
function sebut(a){ if(a.length<=1) return a.join(""); return a.slice(0,-1).join(", ")+" serta "+a[a.length-1]; }
function aspekDari(x){
  const p=PANDUAN[x.id]; if(p&&p.a) return p.a;
  let t=String(x.teks||"").trim().replace(/[.\s]+$/,"");
  const k=t.indexOf(":"); if(k>0&&k<40) t=t.slice(0,k);
  if(t.length>70){ t=t.slice(0,70); const j=t.lastIndexOf(" "); if(j>30) t=t.slice(0,j); }
  if(!/^[A-Z]{2}/.test(t)) t=t.charAt(0).toLowerCase()+t.slice(1);
  return t;
}
function contohDari(x){ const p=PANDUAN[x.id]; return (p&&p.c)||CONTOH_UMUM; }

/* kalimat catatan otomatis dari jawaban. kind: A (skor), M (skor + ya/tidak), U (ya/tidak) */
function teksCatatan(kind,x,d){
  const a=huruf(aspekDari(x)), top=skorTertinggi();
  const T=n=>{ n=num(n); if(!n) return "";
    if(n>=top)   return a+" terlaksana sangat baik, runtut, dan konsisten; murid terlibat aktif. Layak menjadi praktik baik.";
    if(n===top-1)return a+" terlaksana dengan baik dan sesuai tujuan; masih ada bagian kecil yang dapat disempurnakan.";
    if(n===top-2)return a+" baru terlaksana sebagian dan belum konsisten. Perlu penguatan dan pendampingan.";
    return a+" belum tampak atau baru sedikit terlaksana. Perlu pendampingan langsung dan contoh praktik."; };
  if(kind==="A") return T(d);
  if(kind==="U"){
    if(d==="ya") return a+" tampak terlaksana pada pembelajaran yang diamati.";
    if(d==="tidak") return a+" belum tampak; perlu dirancang pada pembelajaran berikutnya.";
    return ""; }
  d=d||{};
  if(d.ya==="tidak") return "Langkah "+aspekDari(x)+" belum terlaksana pada pembelajaran yang diamati. Perlu pendampingan.";
  if(num(d.skor)) return T(d.skor);
  if(d.ya==="ya") return a+" tampak terlaksana.";
  return "";
}
function itemCatatan(kind,id){
  if(kind==="A") return S.instrumen.bagianA.find(x=>x.id===id);
  if(kind==="U") return S.instrumen.udl.find(x=>x.id===id);
  return langkahModel(draft).find(x=>x.id===id);
}
function bindCatatan(kind,id){ return kind==="A"?"catatanA."+id : kind==="M"?"skorModel."+id+".catatan" : "udl."+id+".catatan"; }
function jawabanDari(kind,id){
  if(kind==="A") return draft.skorA[id];
  if(kind==="U") return (draft.udl[id]||{}).ya;
  return draft.skorModel[id]||{};
}
/* isi catatan satu indikator. Catatan yang sudah Anda ketik sendiri tidak ditimpa, kecuali paksa=true */
function terapkanCatatan(kind,id,paksa){
  const x=itemCatatan(kind,id); if(!x) return false;
  const teks=teksCatatan(kind,x,jawabanDari(kind,id)); if(!teks) return false;
  const b=bindCatatan(kind,id); draft.autoCatatan=draft.autoCatatan||{};
  const cur=getPath(draft,b)||"";
  if(!paksa && cur && cur!==draft.autoCatatan[b]) return false;
  setPath(draft,b,teks); draft.autoCatatan[b]=teks;
  const el=document.querySelector('[data-bind="'+b+'"]'); if(el) el.value=teks;
  return true;
}
function isiCatatanSemua(kinds){
  let n=0;
  (kinds||["A","M","U"]).forEach(k=>{
    const arr = k==="A"?aktifA() : k==="U"?aktifUDL() : langkahModel(draft);
    arr.forEach(x=>{ if(terapkanCatatan(k,x.id,false)) n++; });
  });
  return n;
}
function autoDariBind(b){
  let m;
  if((m=b.match(/^skorA\.(.+)$/))) return terapkanCatatan("A",m[1],false);
  if((m=b.match(/^skorModel\.(.+)\.(skor|ya)$/))) return terapkanCatatan("M",m[1],false);
  if((m=b.match(/^udl\.(.+)\.ya$/))) return terapkanCatatan("U",m[1],false);
  return false;
}

/* analisis jawaban untuk catatan umum, tindak lanjut, dan rekomendasi */
function analisisJawaban(o){
  const h=hitung(o), top=skorTertinggi(), batas=top/2;
  const A=aktifA(), U=aktifUDL(), MI=langkahModel(o);
  const nilaiA=A.map(x=>({x,skor:num(o.skorA&&o.skorA[x.id])})).filter(r=>r.skor>0);
  const nilaiM=MI.map(x=>{const d=(o.skorModel&&o.skorModel[x.id])||{};return {x,skor:num(d.skor),tidak:d.ya==="tidak",m:true};})
    .filter(r=>r.skor>0||r.tidak);
  const udlJawab=U.filter(x=>o.udl&&o.udl[x.id]&&o.udl[x.id].ya);
  const udlTidak=udlJawab.filter(x=>o.udl[x.id].ya==="tidak");
  const lemahA=nilaiA.filter(r=>r.skor<=batas).sort((p,q)=>p.skor-q.skor);
  const lemahM=nilaiM.filter(r=>r.tidak||r.skor<=batas).sort((p,q)=>(p.tidak?0:p.skor)-(q.tidak?0:q.skor));
  const semua=nilaiA.concat(nilaiM).filter(r=>!r.tidak);
  let kuat=semua.filter(r=>r.skor>=top);
  if(!kuat.length) kuat=semua.filter(r=>r.skor===top-1);
  const kat=S.instrumen.kategori.slice().sort((p,q)=>q.min-p.min);
  const idx=Math.max(0,kat.findIndex(k=>k.label===h.kategori.label));
  const level=kat.length>1?Math.round(idx/(kat.length-1)*3):0;
  const model=o.modelId==="lainnya"?(o.modelLain||"Lainnya"):((getModel(o.modelId)||{}).nama||"");
  const berikut=idx>0?kat[idx-1]:null;
  return {h,lemahA,lemahM,kuat,udlJawab,udlTidak,level,model,berikut,ada:(nilaiA.length+nilaiM.length+udlJawab.length)>0};
}
const aspekRow = r => (r.m?"langkah ":"")+aspekDari(r.x);
const daftarAspek = (rows,n,f)=>sebut(rows.slice(0,n||3).map(f||(r=>aspekDari(r.x))));

function rekomendasiOtomatis(o){
  const an=analisisJawaban(o), h=an.h;
  let r="Capaian observasi "+h.persen+"% ("+h.kategori.label+"). ";
  if(an.lemahA.length) r+="Prioritas penguatan Bagian A: "+daftarAspek(an.lemahA)+". ";
  if(an.lemahM.length) r+="Langkah model "+an.model+" yang perlu diperkuat: "+daftarAspek(an.lemahM)+". ";
  if(an.udlTidak.length) r+="Penerapan UDL perlu ditingkatkan pada "+sebut(an.udlTidak.slice(0,3).map(aspekDari))+". ";
  if(!an.lemahA.length&&!an.lemahM.length&&!an.udlTidak.length) r+="Pertahankan praktik baik dan bagikan dalam komunitas belajar sekolah.";
  return r.trim();
}
function umumOtomatis(o){
  const an=analisisJawaban(o), h=an.h; if(!an.ada) return null;
  const lemah=[];
  if(an.lemahA.length) lemah.push("Bagian A: "+daftarAspek(an.lemahA));
  if(an.lemahM.length) lemah.push("langkah model "+an.model+": "+daftarAspek(an.lemahM));
  if(an.udlTidak.length) lemah.push("UDL: "+sebut(an.udlTidak.slice(0,3).map(aspekDari)));
  return {
    catatanUmum:"Pembelajaran"+(o.mapel?" "+o.mapel:"")+" dengan model "+(an.model||"pembelajaran")+" memperoleh capaian "+h.persen+"% ("+h.kategori.label+"). "
      +"Skor Bagian A "+h.skorA+"/"+h.maxA+", model "+h.skorM+"/"+h.maxM+", dan penerapan UDL "+h.udlYa+"/"+h.udlN+".",
    kekuatan: an.kuat.length ? "Guru menunjukkan kekuatan pada "+daftarAspek(an.kuat,3,aspekRow)+"."
      : "Guru telah berupaya menjalankan langkah pembelajaran; kekuatan yang menonjol belum tampak pada penilaian ini.",
    area: lemah.length ? "Perlu pengembangan pada "+lemah.join("; ")+"." : "Belum ditemukan area pengembangan yang menonjol; pertahankan dan jaga konsistensi.",
    rekomendasi: rekomendasiOtomatis(o)
  };
}
function isiUmumOtomatis(paksa){
  const u=umumOtomatis(draft); if(!u) return false;
  draft.autoUmum=draft.autoUmum||{};
  Object.keys(u).forEach(k=>{
    const cur=draft[k]||"";
    if(paksa||!cur||cur===draft.autoUmum[k]){ draft[k]=u[k]; draft.autoUmum[k]=u[k]; }
  });
  return true;
}
function jenisOtomatis(an){
  const daftar=S.settings.jenisTL||[], out=[];
  const add=(...j)=>j.forEach(x=>{ if(daftar.includes(x)&&!out.includes(x)) out.push(x); });
  if(an.level===0) add("Praktik baik","Komunitas belajar");
  else if(an.level===1){ add("Praktik baik","Mentoring"); if(an.lemahA.length) add("Coaching"); }
  else if(an.level===2){ add("Coaching","Mentoring"); if(an.lemahM.length) add("KKG"); add("Observasi ulang"); }
  else add("Coaching","Supervisi lanjutan","Pelatihan","Observasi ulang");
  if(an.udlJawab.length && an.udlTidak.length/an.udlJawab.length>=0.5) add("Workshop");
  if(!out.length) add("Tindak lanjut lainnya");
  return out;
}
function rekomendasiTL(an,jenis){
  const fA=an.lemahA.length?daftarAspek(an.lemahA):"", fM=an.lemahM.length?daftarAspek(an.lemahM):"";
  const kuat=an.kuat.length?daftarAspek(an.kuat,2,aspekRow):"";
  const fUDL=an.udlTidak.length?sebut(an.udlTidak.slice(0,2).map(aspekDari)):"";
  const fokus=[fA,fM&&("langkah model "+an.model+": "+fM)].filter(Boolean).join("; ");
  const T={
    "Praktik baik":()=>"Guru berbagi praktik baik"+(kuat?" pada "+kuat:"")+" kepada rekan sejawat dalam forum sekolah.",
    "Komunitas belajar":()=>"Hasil observasi dibahas dalam komunitas belajar sekolah untuk bertukar strategi pembelajaran"+(fA?", terutama terkait "+fA:"")+".",
    "Coaching":()=>"Coaching individual dengan kepala sekolah/observer"+(fokus?" pada "+fokus:"")+", disertai satu target perbaikan yang disepakati bersama.",
    "Mentoring":()=>"Pendampingan oleh guru sejawat yang berpengalaman"+(fM?" pada langkah model "+an.model+": "+fM:"")+".",
    "KKG":()=>"Pembahasan penerapan model "+an.model+" di KKG"+(fM?", khususnya "+fM:"")+".",
    "Supervisi lanjutan":()=>"Supervisi lanjutan berupa kunjungan kelas setelah guru menerapkan perbaikan.",
    "Workshop":()=>"Workshop singkat penerapan UDL"+(fUDL?" dengan fokus "+fUDL:"")+".",
    "Pelatihan":()=>"Pelatihan penguatan sintaks pembelajaran mendalam"+(fA?", terutama "+fA:"")+".",
    "Observasi ulang":()=>"Observasi ulang pada pertemuan atau semester berikutnya untuk memastikan perbaikan berjalan.",
    "Tindak lanjut lainnya":()=>"Tindak lanjut lain sesuai kebutuhan guru dan kesepakatan dengan kepala sekolah."
  };
  const isi=jenis.map((j,i)=>(i+1)+") "+(T[j]?T[j]():j+" sesuai hasil observasi."));
  return ("Capaian "+an.h.persen+"% ("+an.h.kategori.label+"). "+isi.join(" ")).trim();
}
function targetTL(an){
  const h=an.h, lemah=an.lemahA.concat(an.lemahM), fUDL=an.udlTidak.length?sebut(an.udlTidak.slice(0,2).map(aspekDari)):"";
  if(!an.berikut && !lemah.length && !an.udlTidak.length){
    const kuat=an.kuat.length?daftarAspek(an.kuat,2,aspekRow):"";
    return "Mempertahankan capaian kategori "+h.kategori.label+" (min. "+num(h.kategori.min)+"%) dan membagikan praktik baik"+(kuat?" pada "+kuat:"")+" kepada rekan sejawat.";
  }
  let t = an.berikut
    ? "Capaian naik dari "+h.persen+"% menjadi minimal "+num(an.berikut.min)+"% (kategori "+an.berikut.label+") pada observasi berikutnya"
    : "Capaian dipertahankan pada kategori "+h.kategori.label+" (min. "+num(h.kategori.min)+"%) pada observasi berikutnya";
  if(lemah.length) t+=", dengan "+daftarAspek(lemah,3,aspekRow)+" meningkat minimal satu tingkat pada skala penilaian";
  if(fUDL) t+=", serta "+fUDL+" terpenuhi dalam penerapan UDL";
  return t+".";
}
function isiTLOtomatis(paksa){
  const an=analisisJawaban(draft); if(!an.ada) return false;
  const jenis=jenisOtomatis(an), rek=rekomendasiTL(an,jenis), t=draft.tl;
  draft.autoTL=draft.autoTL||{};
  if(paksa||!t.jenis.length||t.jenis.join("|")===draft.autoTL.jenis){ t.jenis=jenis.slice(); draft.autoTL.jenis=jenis.join("|"); }
  if(paksa||!t.rekomendasi||t.rekomendasi===draft.autoTL.rekomendasi){ t.rekomendasi=rek; draft.autoTL.rekomendasi=rek; }
  const tg=targetTL(an);
  if(paksa||!t.target||t.target===draft.autoTL.target){ t.target=tg; draft.autoTL.target=tg; }
  return true;
}

/* tempat dan tanggal pengesahan laporan */
function tempatPengesahan(o){ return ((o&&o.tempatTTD)||"").trim()||S.settings.tempatPengesahan||"Lanas"; }
function tanggalPengesahan(o,pratinjau){
  const mode=o.modeTTD||"auto";
  if(mode==="manual") return o.tanggalTTD||o.tanggal||tglLokal();
  if(mode==="observasi") return o.tanggal||tglLokal();
  if(pratinjau||!o.diubah) return pratinjau?tglLokal():(o.tanggal||tglLokal());
  const d=new Date(o.diubah); return isNaN(d)?tglLokal():tglLokal(d);
}
const teksTTD=(o,pratinjau)=>tempatPengesahan(o)+", "+tglResmi(tanggalPengesahan(o,pratinjau));
function segarkanTTD(){ const el=$("#ttd-preview"); if(el&&draft) el.textContent=teksTTD(draft,true); }

}

  }).join("");

async function susunSintaksAI(){
  const nama=(draft.modelLain||"").trim();
  if(!nama){ toast("Tulis nama model pada langkah 1"); return; }
  aiPesan=""; aiBusy=true; render();
  try{
    const sample = (window.claude && claude.use) ? await claude.use("sample") : null;
    if(!sample){ aiPesan="Penyusunan otomatis tidak tersedia pada tampilan ini. Silakan tambahkan langkah secara manual."; return; }
    const prompt =
      "Anda membantu kepala sekolah SD menyusun instrumen observasi pembelajaran di Indonesia.\n"+
      "Model pembelajaran yang diobservasi: \""+nama+"\".\n"+
      "Tuliskan sintaks (langkah baku) model tersebut secara urut, antara 4 sampai 8 langkah, sesuai teori yang lazim dipakai. "+
      "Setiap langkah ditulis sebagai satu kalimat indikator yang dapat diamati langsung di kelas SD, diawali kata kerja "+
      "(misalnya \"Guru ...\" atau \"Murid ...\"), maksimal 20 kata, bahasa Indonesia baku, diakhiri titik. "+
      "Selaraskan dengan kerangka pembelajaran mendalam (memahami, mengaplikasi, merefleksi).\n"+
      "Jika nama model tidak dikenali sebagai model pembelajaran, kembalikan langkah kosong dan beri catatan singkat.\n"+
      "Jawab HANYA JSON tanpa penjelasan lain, berbentuk: "+
      "{\"langkah\":[\"kalimat 1\",\"kalimat 2\"],\"catatan\":\"satu kalimat sumber atau keterangan\"}";
    const out = await sample.json(prompt,{modelTier:"default"});
    const arr = (out && Array.isArray(out.langkah)) ? out.langkah.filter(x=>typeof x==="string" && x.trim()) : [];
    if(!arr.length){ aiPesan = (out&&out.catatan) ? String(out.catatan) : "Sintaks model itu belum dapat disusun. Tambahkan langkah secara manual."; return; }
    draft.sintaksLainList = arr.slice(0,10).map((t,i)=>({id:"lain"+(i+1), teks:t.trim()}));
    draft.skorModel = {};
    draft.sintaksSumber = (out.catatan? String(out.catatan)+" " : "")+"Sintaks disusun dengan bantuan AI, periksa dan sunting sesuai kondisi kelas.";
    toast("Sintaks tersusun, silakan diperiksa");
  }catch(err){
    aiPesan = err && err.code==="not_granted" ? "Izin penggunaan AI belum diberikan. Tambahkan langkah secara manual."
      : "Penyusunan gagal: "+((err&&err.message)||"jaringan bermasalah")+". Coba lagi atau isi manual.";
  }finally{ aiBusy=false; render(); }
}

    .filter(o=>!filt.periode||o.periode===filt.periode)
    .filter(o=>!filt.status||((o.tl&&o.tl.status)||"Belum")===filt.status)
    .sort((a,b)=>(a.tanggal||"").localeCompare(b.tanggal||""));
}

/* ---------- ANALISIS ---------- */
function vAnalisis(){
  const list=obsTA();
  if(!list.length) return `<div class="card empty"><b>Analisis belum tersedia</b>Diperlukan minimal satu observasi pada tahun ajaran aktif.</div>`;
  const A=aktifA();
  const perInd = A.map(i=>{
    const v=list.map(o=>num(o.skorA&&o.skorA[i.id])).filter(x=>x>0);
    const r=v.length? v.reduce((a,b)=>a+b,0)/v.length : 0;
    return {teks:i.teks, rata:Math.round(r*100)/100, pct:Math.round(r/4*100)};
  }).sort((a,b)=>a.rata-b.rata);
  const perGuru = S.guru.map(g=>{
    const v=list.filter(o=>o.guruId===g.id).map(o=>hitung(o).persen);
    return {nama:g.nama, n:v.length, rata:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null};
  }).filter(x=>x.n>0).sort((a,b)=>b.rata-a.rata);
  const U=aktifUDL();
  const perUDL=U.map(i=>{
    const ya=list.filter(o=>o.udl&&o.udl[i.id]&&o.udl[i.id].ya==="ya").length;
    return {teks:i.teks, pct:Math.round(ya/list.length*100)};
  });
  const dist={};
  list.forEach(o=>{const k=hitung(o).kategori.label; dist[k]=(dist[k]||0)+1;});

  const bar=(l,p,sub)=>`<div class="barrow"><div class="bl"><span>${esc(l)}</span><b>${sub}</b></div>
    <div class="bt"><i style="width:${Math.max(2,p)}%"></i></div></div>`;
  return `
  <div class="card"><h3 style="font-size:15px">Indikator Bagian A, terlemah lebih dahulu</h3>
    <div class="bars">${perInd.map(i=>bar(i.teks,i.pct,i.rata)).join("")}</div>
    <p class="xsmall muted" style="margin-top:8px">Tiga indikator teratas pada daftar ini layak menjadi agenda komunitas belajar sekolah.</p></div>
  <div class="card"><h3 style="font-size:15px">Rata-rata capaian per guru</h3>
    <div class="bars">${perGuru.map(g=>bar(g.nama,g.rata,g.rata+"%")).join("")}</div></div>
  <div class="card"><h3 style="font-size:15px">Penerapan UDL</h3>
    <div class="bars">${perUDL.map(u=>bar(u.teks,u.pct,u.pct+"%")).join("")}</div></div>
  <div class="card"><h3 style="font-size:15px">Sebaran kategori hasil</h3>
    <div class="tags" style="margin-top:8px">${Object.keys(dist).map(k=>`<span class="tag">${esc(k)}: ${dist[k]}</span>`).join("")}</div></div>`;
}

/* ============================ EVENTS ============================ */
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.bind && draft && t.type!=="radio"){ setPath(draft,t.dataset.bind,t.value); }
  if(draft && (t.dataset.bind==="tempatTTD"||t.dataset.bind==="tanggalTTD")) segarkanTTD();
  if(t.dataset.filt){ if(t.dataset.filt==="cari") filt.cari=t.value; }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.bind && draft){
    setPath(draft,t.dataset.bind,t.value);
    if(t.dataset.act==="pilih-guru"){
      const g=S.guru.find(x=>x.id===t.value);
      if(g){ draft.namaGuru=g.nama; draft.nip=g.nip||""; draft.kelasFase=g.kelas||""; draft.mapel=g.mapel||""; render(); }
    }
    if(t.dataset.act==="pilih-model"){ render(); }
    if(t.dataset.act==="pilih-ttd"){ render(); }
    if(draft.modeCatatan==="otomatis") autoDariBind(t.dataset.bind);
  }
  if(t.dataset.mode && draft){
    const k=t.dataset.mode; draft[k]=t.value; S.settings[k]=t.value; persist("settings");
    if(t.value==="otomatis"){
      if(k==="modeCatatan"){ isiCatatanSemua(); if(step===5) isiUmumOtomatis(false); }
      if(k==="modeTL") isiTLOtomatis(false);
    }
    render();
  }
  if(t.hasAttribute("data-tl-jenis") && draft){
    const v=t.value; const arr=draft.tl.jenis;
    if(t.checked){ if(!arr.includes(v)) arr.push(v); } else { draft.tl.jenis=arr.filter(x=>x!==v); }
  }
  if(t.dataset.filt && t.dataset.filt!=="cari"){
    if(t.dataset.filt==="ta"){ S.settings.taAktif=t.value; persist("settings"); }
    else filt[t.dataset.filt]=t.value;
    render();
  }
  if(t.dataset.tlStatus){
    const o=S.obs.find(x=>x.id===t.dataset.tlStatus);
    if(o){ o.tl=o.tl||{}; o.tl.status=t.value; persist("obs"); toast("Status diperbarui"); }
  }
});
document.addEventListener("click", async e=>{

    route="beranda"; render(); toast("Masuk sebagai "+a.user); return; }
  if(act==="logout"){ me=null; adminOK=false; draft=null; timEdit=null;
    try{ sessionStorage.removeItem("obsapp.me"); }catch(err){} render(); return; }
  if(act==="tim-tambah"){ timEdit="baru"; render(); return; }
  if(act==="tim-edit"){ timEdit=id; render(); return; }
  if(act==="tim-batal"){ timEdit=null; render(); return; }
  if(act==="tim-simpan"){
    const nama=$("#t-nama").value.trim(), user=$("#t-user").value.trim(), sandi=$("#t-sandi").value, peran=$("#t-peran").value;
    const ak=S.settings.akun, lama=timEdit==="baru"?null:ak.find(x=>x.user===timEdit);
    if(!nama||!user){ toast("Nama lengkap dan nama pengguna wajib diisi"); return; }
    if(sandi&&sandi.length<6){ toast("Kata sandi minimal 6 karakter"); return; }
    if(!lama){
      if(ak.some(x=>x.user.toLowerCase()===user.toLowerCase())){ toast("Nama pengguna sudah dipakai"); return; }
      if(!sandi){ toast("Kata sandi wajib diisi untuk akun baru"); return; }
      ak.push({user,nama,sandi,peran});
    } else {
      if(lama.peran==="Admin"&&peran!=="Admin"&&adaAdmin()<2){ toast("Harus tersisa minimal satu admin"); return; }
      lama.nama=nama; lama.peran=peran; if(sandi) lama.sandi=sandi;
    }
    await persist("settings"); timEdit=null; toast("Akun tersimpan"); render(); return; }
  if(act==="tim-hapus"){
    const a=S.settings.akun.find(x=>x.user===id); if(!a) return;
    if(id===me){ toast("Akun yang sedang dipakai tidak bisa dihapus"); return; }
    if(a.peran==="Admin"&&adaAdmin()<2){ toast("Harus tersisa minimal satu admin"); return; }
    if(!confirm("Hapus akun "+(a.nama||a.user)+"?")) return;
    S.settings.akun=S.settings.akun.filter(x=>x.user!==id); await persist("settings"); render(); return; }
  if(act==="nav"&&b.dataset.r==="sandi"){ await ubahSandi(); return; }
  if(act==="nav"){ if(b.dataset.r==="observasi"){ draft=null; step=1; } go(b.dataset.r); return; }
  if(act==="back"){ if(route==="observasi"&&step>1){step--;render();return;} draft=null; go("beranda"); return; }
  if(act==="theme"){ const cur=document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme", cur==="dark"?"light":"dark"); return; }

  /* guru */
  if(act==="guru-edit"){ go("guru-edit", id||null); return; }
  if(act==="guru-simpan"){
    const d={nama:$("#g-nama").value.trim(),nip:$("#g-nip").value.trim(),tugas:$("#g-tugas").value.trim(),
      kelas:$("#g-kelas").value.trim(),mapel:$("#g-mapel").value.trim()};
    if(!d.nama){ toast("Nama guru belum diisi"); return; }
    if(id){ Object.assign(S.guru.find(x=>x.id===id), d); } else { S.guru.push(Object.assign({id:uid("g")},d)); }
    await persist("guru"); toast("Data guru tersimpan"); go("guru"); return;
  }
  if(act==="guru-hapus"){ if(!confirm("Hapus guru ini dari daftar?")) return;
    S.guru=S.guru.filter(x=>x.id!==id); await persist("guru"); render(); return; }

  /* wizard */
  if(act==="saran"){
    if(!umumOtomatis(draft)){ toast("Isi jawaban pada langkah sebelumnya terlebih dahulu"); return; }
    const au=draft.autoUmum||{};
    const ada=["catatanUmum","kekuatan","area","rekomendasi"].some(k=>draft[k]&&draft[k]!==au[k]);
    if(ada && !confirm("Isian yang sudah Anda tulis akan diganti. Lanjutkan?")) return;
    isiUmumOtomatis(true); render(); return; }
  if(act==="tl-auto"){
    if(!isiTLOtomatis(false)){ toast("Isi jawaban pada langkah sebelumnya terlebih dahulu"); return; }
    const au=draft.autoTL||{};
    const ada=(draft.tl.jenis.length&&draft.tl.jenis.join("|")!==au.jenis)||(draft.tl.rekomendasi&&draft.tl.rekomendasi!==au.rekomendasi)||(draft.tl.target&&draft.tl.target!==au.target);
    if(ada && !confirm("Isian yang sudah Anda ubah akan diganti. Lanjutkan?")) return;
    isiTLOtomatis(true); render(); return; }
  if(act==="cat-auto"){
    if(!terapkanCatatan(b.dataset.kind,id,true)) toast("Pilih jawaban untuk indikator ini terlebih dahulu");
    return; }
  if(act==="cat-auto-semua"){
    const n=isiCatatanSemua([b.dataset.kind]);
    toast(n? n+" catatan terisi" : "Belum ada jawaban baru atau catatan sudah terisi");
    return; }
  if(act==="sintaks-ai"){ await susunSintaksAI(); return; }
  if(act==="sintaks-tambah"){ draft.sintaksLainList=draft.sintaksLainList||[];
    draft.sintaksLainList.push({id:uid("lain"),teks:""}); aiPesan=""; render(); return; }
  if(act==="sintaks-hapus"){ const i=Number(b.dataset.i);
    const h=draft.sintaksLainList[i]; if(h) delete draft.skorModel[h.id];
    draft.sintaksLainList.splice(i,1); render(); return; }
  if(act==="step-prev"){ step--; render(); return; }
  if(act==="step-next"){
    if(step===1){
      if(!draft.guruId){ toast("Pilih nama guru terlebih dahulu"); return; }
      if(!draft.modelId){ toast("Pilih model pembelajaran"); return; }
    }
    if(step===3 && draft.modelId==="lainnya" && !langkahModel(draft).length){
      toast("Susun dahulu langkah model pembelajaran"); return;
    }
    if(step===6){
      const i=S.obs.findIndex(o=>o.id===draft.id);
      draft.diubah=new Date().toISOString();
      if(i>=0) S.obs[i]=JSON.parse(JSON.stringify(draft)); else S.obs.push(JSON.parse(JSON.stringify(draft)));
      await persist("obs"); toast("Observasi tersimpan");
    }
    step++; render(); return;
  }
  if(act==="obs-baru"){ draft=null; step=1; go("observasi"); return; }
  if(act==="obs-edit"){ draft=null; go("observasi", id); return; }
  if(act==="obs-hapus"){ if(!confirm("Hapus observasi ini?")) return;
    S.obs=S.obs.filter(o=>o.id!==id); await persist("obs"); render(); return; }
  if(act==="laporan"){ go("laporan", id); return; }

  /* cetak */
  if(act==="cetak"){ const o=S.obs.find(x=>x.id===id); if(!o) return;
    $("#print-area").innerHTML=laporanHTML(o); setTimeout(()=>window.print(),60); return; }
  if(act==="cetak-rekap"){ $("#print-area").innerHTML=rekapHTML(); setTimeout(()=>window.print(),60); return; }

  /* pin */
  if(act==="pin-cek"){ if($("#pin").value===String(S.settings.pinAdmin)){ adminOK=true; render(); }
    else toast("PIN belum cocok"); return; }

  /* pengaturan */
  if(act==="kat-tambah"){ simpanPengaturan(true); S.instrumen.kategori.push({min:0,label:"Kategori baru",warna:"warn"}); render(); return; }
  if(act==="kat-hapus"){ simpanPengaturan(true); S.instrumen.kategori.splice(Number(b.dataset.i),1); render(); return; }
  if(act==="ind-tambah"){ simpanPengaturan(true);
    const k=b.dataset.k;
    if(k.startsWith("model.")) S.instrumen.model[Number(k.split(".")[1])].indikator.push({id:uid("i"),teks:"Indikator baru",aktif:true});
    else S.instrumen[k].push({id:uid("i"),teks:"Indikator baru",aktif:true});
    render(); return; }
  if(act==="ind-hapus"){ simpanPengaturan(true);
    const k=b.dataset.k, i=Number(b.dataset.i);
    if(k.startsWith("model.")) S.instrumen.model[Number(k.split(".")[1])].indikator.splice(i,1);
    else S.instrumen[k].splice(i,1);
    render(); return; }
  if(act==="model-tambah"){ simpanPengaturan(true);
    S.instrumen.model.push({id:uid("m"),nama:"Model baru",aktif:true,indikator:[]}); render(); return; }
  if(act==="set-simpan"){ simpanPengaturan(); await persist(); toast("Pengaturan tersimpan"); render(); return; }

  /* cadangan */
  if(act==="backup"){
    const data=JSON.stringify(S,null,2);
    const nama="cadangan-observasi-"+S.settings.taAktif.replace("/","-")+".json";
    let dl=null; try{ dl = window.claude&&claude.use ? await claude.use("downloads") : null; }catch(err){}
    if(dl){ try{ await dl.save({filename:nama,data}); toast("Cadangan diunduh"); }catch(err){ toast("Unduhan dibatalkan"); } }
    else {
      const w=document.createElement("textarea"); w.value=data;
      const box=document.createElement("div"); box.className="card";
      box.innerHTML="<b>Salin teks berikut dan simpan sebagai berkas .json</b>";
      box.appendChild(w); $("#app").appendChild(box); w.select();
    }
    return;
  }
  if(act==="restore"){
    const teks=prompt("Tempelkan isi berkas cadangan (JSON):");
    if(!teks) return;
    try{ const d=JSON.parse(teks);
      if(!d.settings||!d.guru) throw new Error("bentuk data tidak dikenali");
      S.settings=Object.assign({},DEF_SETTINGS,d.settings); S.guru=d.guru; S.instrumen=d.instrumen||S.instrumen; S.obs=d.obs||[];
      migrasiInstrumen(S.instrumen);
      await persist(); toast("Data dipulihkan"); render();
    }catch(err){ alert("Cadangan tidak dapat dibaca: "+err.message); }
    return;
  }
  if(act==="reset"){
    if(!confirm("Semua data observasi, guru, dan instrumen akan dikembalikan ke kondisi awal. Lanjutkan?")) return;
    S.settings=JSON.parse(JSON.stringify(DEF_SETTINGS)); S.guru=JSON.parse(JSON.stringify(DEF_GURU));
    S.instrumen=JSON.parse(JSON.stringify(DEF_INSTRUMEN)); S.obs=[];
    await persist(); adminOK=false; go("beranda"); return;
  }
});
function simpanPengaturan(diam){
  $$("[data-set]").forEach(el=>{ S.settings[el.dataset.set]=el.value; });
  $$("[data-set-list]").forEach(el=>{ S.settings[el.dataset.setList]=el.value.split(",").map(x=>x.trim()).filter(Boolean); });
  $$("[data-ins]").forEach(el=>{ S.instrumen[el.dataset.ins]=el.value; });
  $$("[data-kat]").forEach(el=>{ const [i,f]=el.dataset.kat.split("."); if(S.instrumen.kategori[i]) S.instrumen.kategori[i][f]= f==="min"?num(el.value):el.value; });
  $$("[data-skala]").forEach(el=>{ const [i,f]=el.dataset.skala.split("."); if(S.instrumen.skala[i]) S.instrumen.skala[i][f]= f==="n"?num(el.value):el.value; });
  $$("[data-ind]").forEach(el=>{ const p=el.dataset.ind.split("."); const i=Number(p[p.length-1]);
    const arr = p[0]==="model" ? (S.instrumen.model[Number(p[1])]||{}).indikator : S.instrumen[p[0]];
    if(arr&&arr[i]) arr[i].teks=el.value; });
  $$("[data-ind-aktif]").forEach(el=>{ const p=el.dataset.indAktif.split("."); const i=Number(p[p.length-1]);
    const arr = p[0]==="model" ? (S.instrumen.model[Number(p[1])]||{}).indikator : S.instrumen[p[0]];
    if(arr&&arr[i]) arr[i].aktif=el.checked; });
  $$("[data-model]").forEach(el=>{ const [i,f]=el.dataset.model.split("."); if(S.instrumen.model[i]) S.instrumen.model[i][f]=el.value; });
  $$("[data-model-aktif]").forEach(el=>{ const i=Number(el.dataset.modelAktif); if(S.instrumen.model[i]) S.instrumen.model[i].aktif=el.checked; });
  if(!diam) saveLocal();
}
window.addEventListener("beforeprint", ()=>{ if(!$("#print-area").innerHTML && route==="laporan"){
  const o=S.obs.find(x=>x.id===param); if(o) $("#print-area").innerHTML=laporanHTML(o); }});

async function ubahSandi(){
  const a=(S.settings.akun||[]).find(x=>x.user===me); if(!a) return;
  const lama=prompt("Kata sandi saat ini:"); if(lama===null) return;
  if(lama!==a.sandi){ toast("Kata sandi saat ini tidak cocok"); return; }
  const baru=prompt("Kata sandi baru (minimal 6 karakter):"); if(baru===null) return;
  if(baru.length<6){ toast("Kata sandi baru minimal 6 karakter"); return; }
  a.sandi=baru; await persist("settings"); toast("Kata sandi diperbarui");
}
let timEdit=null;
const PERAN=["Supervisor","Observer","Admin"];
const adaAdmin=()=>(S.settings.akun||[]).filter(x=>x.peran==="Admin").length;

  const ak=S.settings.akun||[], adm=adminOK;
  const warna=p=>p==="Admin"?"warn":p==="Supervisor"?"ok":"info";
  const baris=ak.map(a=>`<div class="list-item"><div class="spread"><div class="t">${esc(a.nama||a.user)}</div><span class="tag ${warna(a.peran)}">${esc(a.peran)}</span></div>
    <div class="small muted">Nama pengguna: ${esc(a.user)}${a.user===me?" · akun Anda":""}</div>
    ${adm?`<div class="row" style="margin-top:10px"><button class="btn sm" data-act="tim-edit" data-id="${esc(a.user)}">Ubah</button>
    <button class="btn sm danger" data-act="tim-hapus" data-id="${esc(a.user)}">Hapus</button></div>`:""}</div>`).join("");
  let form="";
  if(adm && timEdit!==null){
    const baru=timEdit==="baru", e=baru?{nama:"",user:"",peran:"Supervisor"}:(ak.find(x=>x.user===timEdit)||{nama:"",user:"",peran:"Supervisor"});

    <label class="f"><span>Nama lengkap</span><input id="t-nama" value="${esc(e.nama||"")}" placeholder="Nama beserta gelar"></label>
    <label class="f"><span>Nama pengguna</span><input id="t-user" autocapitalize="none" value="${esc(e.user)}" ${baru?"":"readonly"}></label>
    <label class="f"><span>Kata sandi${baru?"":" (kosongkan jika tidak diganti)"}</span><input id="t-sandi" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"></label>
    <label class="f"><span>Peran</span><select id="t-peran">${PERAN.map(r=>`<option ${r===e.peran?"selected":""}>${r}</option>`).join("")}</select></label>
    <div class="btnrow" style="margin-top:14px"><button class="btn" data-act="tim-batal">Batal</button><button class="btn primary" data-act="tim-simpan">Simpan akun</button></div></div>`;

    ${adm?'<div style="margin-top:12px"><button class="btn primary sm" data-act="tim-tambah">Tambah akun</button></div>':""}</div>
  ${form}${baris}`;
}
